{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | Office Time Tracker</title>

    <link rel="stylesheet" href="{% static 'accounts/css/signin.css' %}">
</head>

<body>

    <div class="container">

        <!-- Brand -->
        <div class="brand">

            <div class="brand-icon">
                <span>◷</span>
            </div>

            <h1>Welcome back</h1>

            <p>Sign in to track today's hours</p>

        </div>


        <!-- Login Card -->
        <div class="login-card">

            {% if messages %}
                {% for message in messages %}
                    <div class="message">
                        {{ message }}
                    </div>
                {% endfor %}
            {% endif %}


            <form method="POST">

                {% csrf_token %}


                <!-- Email -->
                <div class="form-group">

                    <label for="email">
                        Email
                    </label>

                    <div class="input-wrapper">

                        <span class="input-icon">
                            ✉
                        </span>

                        <input
                            id="email"
                            type="email"
                            name="email"
                            placeholder="you@company.com"
                            autocomplete="email"
                            required
                        >

                    </div>

                </div>


                <!-- Password -->
                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <div class="input-wrapper">

                        <span class="input-icon">
                            🔒
                        </span>

                        <input
                            id="password"
                            type="password"
                            name="password"
                            placeholder="••••••••"
                            autocomplete="current-password"
                            required
                        >

                        <button
                            type="button"
                            id="passwordToggle"
                            class="password-toggle"
                            aria-label="Show password"
                        >
                            👁
                        </button>

                    </div>

                </div>


                <!-- Forgot Password -->
                <div class="forgot">
                    <a href="#">
                        Forgot password?
                    </a>
                </div>


                <!-- Login Button -->
                <button
                    type="submit"
                    class="login-button"
                >
                    <span>Sign in</span>
                    <span class="arrow">→</span>
                </button>

            </form>

        </div>


        <!-- Signup -->
        <p class="signup">

            New here?

            <a href="{% url 'signup' %}">
                Create an account
            </a>

        </p>

    </div>


    <script src="{% static 'accounts/js/signin.js' %}"></script>

</body>

</html>
